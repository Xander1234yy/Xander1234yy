<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas><script>
const W=1920,H=1080,c=document.getElementById('c'),x=c.getContext('2d');
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const eo=t=>1-Math.pow(1-cl(t),3), eio=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const seg=(t,a,b)=>cl((t-a)/(b-a));
const fadeIO=(t,a,b,f=.6)=>Math.min(seg(t,a,a+f),1-seg(t,b-f,b));
const COLORS={orange:['#f39a5b','#d9622b','#8f3612'],blue:['#4a5d82','#26344f','#121a2b'],silver:['#f1f1f3','#cfd0d4','#9a9ba0']};
function rr(px,py,w,h,r){x.beginPath();x.roundRect(px,py,w,h,r);}
function text(s,px,py,size,weight=600,color='#f5f5f7',alpha=1,align='center',grad=null,ls=0){
  x.save();x.globalAlpha*=alpha;x.font=`${weight} ${size}px Inter`;x.textAlign=align;x.textBaseline='middle';
  if(ls)x.letterSpacing=ls+'px';
  if(grad){const m=x.measureText(s).width;const g=x.createLinearGradient(px-m/2,0,px+m/2,0);grad.forEach((c,i)=>g.addColorStop(i/(grad.length-1),c));x.fillStyle=g}else x.fillStyle=color;
  x.fillText(s,px,py);x.restore();}
function lens(cx,cy,r,glint){
  // outer ring
  let g=x.createRadialGradient(cx-r*.3,cy-r*.3,r*.2,cx,cy,r);g.addColorStop(0,'#4a4a4f');g.addColorStop(1,'#151517');
  x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();
  x.fillStyle='#050507';x.beginPath();x.arc(cx,cy,r*.78,0,7);x.fill();
  g=x.createRadialGradient(cx,cy,0,cx,cy,r*.6);g.addColorStop(0,'#1b2a4a');g.addColorStop(.5,'#0b0f1e');g.addColorStop(1,'#020205');
  x.fillStyle=g;x.beginPath();x.arc(cx,cy,r*.6,0,7);x.fill();
  x.fillStyle='rgba(120,90,200,.35)';x.beginPath();x.arc(cx+r*.12,cy+r*.1,r*.22,0,7);x.fill();
  x.fillStyle=`rgba(255,255,255,${.55+.4*glint})`;x.beginPath();x.ellipse(cx-r*.22,cy-r*.24,r*.12,r*.07,-.7,0,7);x.fill();
}
// phone back. sx = horizontal squash (rotation), sheen 0..1 position of light sweep
function phoneBack(cx,cy,h,col,sx=1,sheen=-1,glint=0){
  const w=h*.485,C=COLORS[col];x.save();x.translate(cx,cy);x.scale(sx,1);
  const L=-w/2,T=-h/2,R=w*.17;
  // shadow
  x.save();x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=h*.08;x.shadowOffsetY=h*.03;rr(L,T,w,h,R);x.fillStyle=C[1];x.fill();x.restore();
  // body (aluminium)
  let g=x.createLinearGradient(L,0,L+w,0);g.addColorStop(0,C[2]);g.addColorStop(.08,C[0]);g.addColorStop(.5,C[1]);g.addColorStop(.92,C[0]);g.addColorStop(1,C[2]);
  rr(L,T,w,h,R);x.fillStyle=g;x.fill();
  // glass panel lower
  const ph=h*.27;rr(L+w*.035,T+ph+h*.02,w*.93,h-ph-h*.055,R*.8);
  g=x.createLinearGradient(0,T+ph,0,T+h);g.addColorStop(0,C[1]);g.addColorStop(1,C[2]);x.globalAlpha=.55;x.fillStyle=g;x.fill();x.globalAlpha=1;
  // plateau
  rr(L+w*.012,T+h*.006,w*.976,ph,[R*.95,R*.95,R*.35,R*.35]);
  g=x.createLinearGradient(0,T,0,T+ph);g.addColorStop(0,C[0]);g.addColorStop(1,C[1]);x.fillStyle=g;x.fill();
  x.strokeStyle='rgba(0,0,0,.25)';x.lineWidth=h*.003;x.stroke();
  // camera bump
  const bx=L+w*.05,by=T+h*.022,bw=w*.56,bh=ph-h*.035;
  x.save();x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=h*.02;rr(bx,by,bw,bh,bw*.28);x.fillStyle=C[1];x.fill();x.restore();
  g=x.createLinearGradient(bx,by,bx+bw,by+bh);g.addColorStop(0,C[0]);g.addColorStop(1,C[2]);rr(bx,by,bw,bh,bw*.28);x.fillStyle=g;x.fill();
  const lr=bw*.215;
  lens(bx+bw*.27,by+bh*.27,lr,glint);lens(bx+bw*.27,by+bh*.73,lr,glint);lens(bx+bw*.73,by+bh*.5,lr,glint);
  // flash + lidar on plateau right
  x.fillStyle='#e9e2c9';x.beginPath();x.arc(L+w*.8,T+ph*.33,w*.035,0,7);x.fill();
  x.fillStyle='#111';x.beginPath();x.arc(L+w*.8,T+ph*.68,w*.033,0,7);x.fill();
  x.fillStyle='#000';x.beginPath();x.arc(L+w*.69,T+ph*.33,w*.008,0,7);x.fill();
  // sheen sweep
  if(sheen>-1){x.save();rr(L,T,w,h,R);x.clip();const sxp=L+(w*2.4)*sheen-w*.7;
    g=x.createLinearGradient(sxp,T,sxp+w*.5,T+h*.4);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.28)');g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g;x.fillRect(L,T,w,h);x.restore();}
  // edge highlight
  rr(L,T,w,h,R);x.strokeStyle='rgba(255,255,255,.25)';x.lineWidth=h*.004;x.stroke();
  x.restore();
}
function phoneFront(cx,cy,h,t,bright=1){
  const w=h*.485,L=cx-w/2,T=cy-h/2,R=w*.17;x.save();
  x.shadowColor='rgba(0,0,0,.7)';x.shadowBlur=h*.08;rr(L,T,w,h,R);x.fillStyle='#d9622b';x.fill();x.shadowBlur=0;
  rr(L+w*.012,T+w*.012,w*.976,h-w*.024,R*.95);x.fillStyle='#000';x.fill();
  const sL=L+w*.045,sT=T+w*.045,sw=w*.91,sh=h-w*.09;
  x.save();rr(sL,sT,sw,sh,R*.8);x.clip();
  const a=t*.4;let g=x.createLinearGradient(sL,sT,sL+sw,sT+sh);
  g.addColorStop(0,`hsl(${20+10*Math.sin(a)},90%,${45*bright}%)`);g.addColorStop(.5,`hsl(${330+15*Math.sin(a+1)},70%,${30*bright}%)`);g.addColorStop(1,`hsl(${230},70%,${12*bright}%)`);
  x.fillStyle=g;x.fillRect(sL,sT,sw,sh);
  for(let i=0;i<3;i++){const bx=sL+sw*(.3+.4*Math.sin(a*1.3+i*2)),by=sT+sh*(.4+.3*Math.cos(a+i*1.7));
    g=x.createRadialGradient(bx,by,0,bx,by,sw*.6);g.addColorStop(0,`hsla(${[25,300,200][i]},95%,60%,${.45*bright})`);g.addColorStop(1,'hsla(0,0%,0%,0)');x.fillStyle=g;x.fillRect(sL,sT,sw,sh);}
  text('9:41',cx,sT+sh*.2,sw*.27,600,'rgba(255,255,255,.95)');
  text('zaterdag 15 november',cx,sT+sh*.12,sw*.055,500,'rgba(255,255,255,.85)');
  x.restore();
  rr(cx-w*.17,sT+sh*.018,w*.34,w*.1,w*.05);x.fillStyle='#000';x.fill();
  x.restore();
}
function chip(cx,cy,s,t,glow){
  x.save();x.translate(cx,cy);
  // traces
  x.strokeStyle=`rgba(255,140,70,${.25*glow})`;x.lineWidth=2;
  for(let i=0;i<24;i++){const ang=i/24*Math.PI*2,r0=s*.75,r1=s*(1.4+.5*((i*7)%5)/5);const p=cl((t*1.2-i*.02)%1.5);
    x.beginPath();x.moveTo(Math.cos(ang)*r0,Math.sin(ang)*r0);x.lineTo(Math.cos(ang)*r1,Math.sin(ang)*r1);x.stroke();
    x.fillStyle=`rgba(255,180,120,${glow*(1-p)})`;const rp=r0+(r1-r0)*p;x.beginPath();x.arc(Math.cos(ang)*rp,Math.sin(ang)*rp,3,0,7);x.fill();}
  let g=x.createRadialGradient(0,0,0,0,0,s*1.6);g.addColorStop(0,`rgba(255,120,50,${.35*glow})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(-s*2,-s*2,s*4,s*4);
  x.shadowColor=`rgba(255,110,40,${.8*glow})`;x.shadowBlur=60;
  rr(-s*.75,-s*.75,s*1.5,s*1.5,s*.16);g=x.createLinearGradient(-s,-s,s,s);g.addColorStop(0,'#3a3a3e');g.addColorStop(1,'#111113');x.fillStyle=g;x.fill();x.shadowBlur=0;
  x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=2;x.stroke();
  rr(-s*.66,-s*.66,s*1.32,s*1.32,s*.12);x.strokeStyle='rgba(255,255,255,.1)';x.stroke();
  text('A19',0,-s*.05,s*.48,700,'#fff',1,'center',['#ffd2a8','#ff8a3d','#e14d1f']);
  text('PRO',0,s*.36,s*.2,700,'#f5f5f7',1,'center',null,s*.04);
  x.restore();
}
function render(t){
  x.globalAlpha=1;x.fillStyle='#000';x.fillRect(0,0,W,H);
  // S1 0-5 intro text
  if(t<5.2){
    text('Hallo, meesterbrein.',W/2,H/2-30-20*eo(seg(t,.3,1.5)),44,500,'#86868b',fadeIO(t,.3,2.6));
    const a=fadeIO(t,2.4,5.2,.7);x.save();x.translate(W/2,H/2);const s=1+.06*seg(t,2.4,5.2);x.scale(s,s);
    text('Pro.',0,0,260,700,'#fff',a,'center',['#ffcf9f','#ff8a3d','#d9622b']);x.restore();
  }
  // S2 5-12 phone reveal
  if(t>4.8&&t<12.4){
    const a=fadeIO(t,4.8,12.4,.6),p=eio(seg(t,4.8,9.5));x.save();x.globalAlpha=a;
    let g=x.createRadialGradient(W/2,H*.55,0,W/2,H*.55,900);g.addColorStop(0,`rgba(217,98,43,${.25*p})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
    const sx=Math.max(.04,Math.abs(Math.cos((1-p)*Math.PI*.5)));
    phoneBack(W/2,H*.58+120*(1-p),780*(0.85+.15*p),'orange',sx,seg(t,8,10.5),.5+.5*Math.sin(t*3));
    text('iPhone 17 Pro',W/2,95,72,600,'#f5f5f7',eo(seg(t,9,10)));
    x.restore();
  }
  // S3 12-19 unibody + colors
  if(t>12&&t<19.4){
    const a=fadeIO(t,12,19.4,.6);x.save();x.globalAlpha=a;
    text('Aluminium unibody.',W/2,130,84,700,'#f5f5f7',eo(seg(t,12.3,13.3)));
    text('Licht. Sterk. Gesmeed voor prestaties.',W/2,215,38,500,'#86868b',eo(seg(t,13,14)));
    const cols=['blue','orange','silver'],names=['Diep Blauw','Kosmisch Oranje','Zilver'];
    cols.forEach((cname,i)=>{const p=eo(seg(t,12.6+i*.35,14.2+i*.35));const ox=(i-1)*470;
      phoneBack(W/2+ox,H*.6+300*(1-p),560+(i==1?40:0),cname,1,seg(t,15.5+i*.3,17.5+i*.3),.5);
      text(names[i],W/2+ox,H-50,30,500,'#d2d2d7',eo(seg(t,15+i*.2,16+i*.2)));});
    x.restore();
  }
  // S4 19-26 chip
  if(t>19&&t<26.4){
    const a=fadeIO(t,19,26.4,.6);x.save();x.globalAlpha=a;const p=eo(seg(t,19.2,21));
    x.save();x.translate(W/2,H*.44);x.scale(.7+.3*p,.7+.3*p);chip(0,0,190,t,p);x.restore();
    text('Het krachtigste brein ooit in een iPhone.',W/2,H-230,56,700,'#f5f5f7',eo(seg(t,21,22)));
    text('Met vapor chamber-koeling voor aanhoudende topprestaties.',W/2,H-160,34,500,'#86868b',eo(seg(t,21.8,22.8)));
    x.restore();
  }
  // S5 26-33 camera
  if(t>26&&t<33.4){
    const a=fadeIO(t,26,33.4,.6);x.save();x.globalAlpha=a;const p=eio(seg(t,26,29));
    const h=860+1900*p;phoneBack(W*.5+560*p,H*.5+h*.33*p,h,'orange',1,seg(t,26.5,28.5),.5+.5*Math.sin(t*2.5));
    let g=x.createLinearGradient(0,0,W*.6,0);g.addColorStop(0,'rgba(0,0,0,.9)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.globalAlpha=a*p;x.fillRect(0,0,W,H);x.globalAlpha=a;
    const q=eo(seg(t,28.6,29.6));
    text('48 MP',180,H/2-150,170,700,'#fff',q,'left',['#ffd2a8','#ff8a3d']);
    text('Drie Fusion-camera’s. Allemaal 48 MP.',184,H/2-20,40,600,'#f5f5f7',eo(seg(t,29.2,30.2)),'left');
    const z=Math.min(8,Math.floor(1+7*eo(seg(t,30,31.6))));
    text(z+'×',180,H/2+130,120,700,'#fff',eo(seg(t,30,30.6)),'left');
    text('zoom in optische kwaliteit',184,H/2+225,36,500,'#86868b',eo(seg(t,30.4,31.2)),'left');
    x.restore();
  }
  // S6 33-39.5 display
  if(t>33&&t<39.9){
    const a=fadeIO(t,33,39.9,.6);x.save();x.globalAlpha=a;const p=eo(seg(t,33,34.8));
    phoneFront(W*.66,H*.53+200*(1-p),880,t,.4+.6*eo(seg(t,34,35.5)));
    text('Briljant.',W*.08,H/2-120,120,700,'#fff',eo(seg(t,34.3,35.3)),'left');
    text('6,3″ Super Retina XDR-display.',W*.08+4,H/2,40,600,'#f5f5f7',eo(seg(t,35,36)),'left');
    const n=Math.round(3000*eo(seg(t,35.6,37.4)));
    text(n.toLocaleString('nl-NL')+' nits',W*.08,H/2+110,80,700,'#fff',eo(seg(t,35.6,36.2)),'left',['#fff','#ffb27a']);
    text('Ceramic Shield 2. Voor en achter.',W*.08+4,H/2+200,34,500,'#86868b',eo(seg(t,36.6,37.6)),'left');
    x.restore();
  }
  // S7 39.5-46 end
  if(t>39.5){
    const a=seg(t,39.6,40.6)*(1-seg(t,45.4,46));x.save();x.globalAlpha=a;
    let g=x.createRadialGradient(W/2,H/2,0,W/2,H/2,800);g.addColorStop(0,'rgba(217,98,43,.18)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
    x.save();x.translate(W/2,H/2-40);const s=1.05-.05*eo(seg(t,39.6,42));x.scale(s,s);
    text('iPhone 17 Pro',0,0,150,700,'#fff',1,'center',['#ffcf9f','#ff8a3d','#d9622b']);x.restore();
    text('Pro. Op een heel nieuw niveau.',W/2,H/2+90,44,500,'#d2d2d7',eo(seg(t,40.8,41.8)));
    text('Fan-made concept · geen officiële Apple-productie',W/2,H-50,20,400,'#6e6e73',eo(seg(t,41.5,42.5)));
    x.restore();
  }
}
window.renderFrame=render;window.ready=document.fonts.load('700 50px Inter').then(()=>document.fonts.load('500 50px Inter')).then(()=>document.fonts.load('600 50px Inter'));
</script></body></html>
