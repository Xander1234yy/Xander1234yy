# Configuratie voor de Supabase CLI (lokale ontwikkeling met `npx supabase start`, vereist Docker).
# Voor een gehoste Supabase-database is dit bestand niet nodig: gebruik `npm run db:migrate`.
project_id = "homeos"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = false

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
