<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04060c" />
    <title>Geen verbinding · HomeOS</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #04060c; color: #e8eefc; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 420px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #8c99b5; margin: 0 0 20px; }
      button { background: #3b7bf5; color: #fff; border: 0; border-radius: 12px; padding: 10px 18px; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Geen verbinding met HomeOS</h1>
      <p>Je apparaat is offline, of je laptop met HomeOS is niet bereikbaar. Er worden geen opdrachten bewaard om later uit te voeren.</p>
      <button onclick="location.reload()">Opnieuw proberen</button>
    </main>
  </body>
</html>
