[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "1.3.0"
description = "J.A.R.V.I.S. - persoonlijke AI-assistent op basis van Claude"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.8.0", "psutil>=5.9", "gassist-text>=0.0.11", "google-auth>=2.20"]

[project.optional-dependencies]
home = ["google-auth-oauthlib>=1.0", "pychromecast>=14.0"]
voice = ["SpeechRecognition>=3.10", "PyAudio>=0.2.14", "pyttsx3>=2.90"]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools]
packages = ["jarvis", "jarvis.home"]

[tool.setuptools.package-data]
jarvis = ["static/*"]
